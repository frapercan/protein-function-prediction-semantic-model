[project]
name = "protein-function-prediction-semantic-model"
version = "0.0.0"
description = "Semantic model of protein function prediction: its concepts, the components that implement or document them, and the relations between them."
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
# The model itself is data (schema/ and data/); these tools build and check it.
dev = [
    "linkml>=1.9,<2",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
