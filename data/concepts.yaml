    - cut_photo_member
  - where: panel
    names:
    - corpus de la foto 211
  - where: laboratory
    names:
    - banco del marco en 211
  naming_conflict: >-
    Invisible in the API, the user interface and the glossary; the laboratory calls it a bank; the metaphor
    is never explained.
