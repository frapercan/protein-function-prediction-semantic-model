# Semantic model of protein function prediction: concepts, version 0.1.
# Version 0 was imported from the closure map of 2026-11-20; version 0.1 adds the concepts of the
# literature ladder, with the names the author accepted on 2026-11-28. See README.md, "Status".
id: protein_function_prediction_semantic_model
title: Semantic model of protein function prediction
version: 0.1.0
description: >-
  Version 0.1: the 35 concept candidates of the closure map of 2026-11-20, imported as they were found and
  written in English, whose names the author has not chosen yet; and the 34 concepts of the literature
  ladder, whose names he accepted on 2026-11-28.
concepts:
- id: go_term
  status: candidate
  label_en: GO term
  label_es: término GO
  candidate_names:
  - GO term
  top_category: data
  definition_en: >-
    A class of the Gene Ontology, with an identifier GO:nnnnnnn, in an ontology snapshot; the only thing
    the project calls a term.
  external_match: 'Gene Ontology: term'
  current_names:
  - where: PROTEA
    names:
    - go_term
  - where: panel
    names:
    - término
  - where: laboratory
    names:
    - término
    - term
  naming_conflict: >-
    No conflict in the code; the closure reserves the word for this use and avoids it in criteria and
    texts.
- id: knowledge_cut
  status: candidate
  label_en: knowledge cut
  label_es: corte de conocimiento
  candidate_names:
  - knowledge cut
  top_category: data
  definition_en: >-
    An ordinal GOA release whose knowledge is frozen, with its GOA date and its paired GO and UniProt
    releases.
  current_names:
  - where: ORM
    names:
    - cut_release
  - where: method contract
    names:
    - instance_release
  - where: decoder
    names:
    - corte = segmentación
  - where: user interface
    names:
    - frozen training cuts
  naming_conflict: >-
    The word names a date, an export, a segmentation and a threshold; cut 211 appears as GO 2022-07 and
    as GOA 2022-09-16.
- id: cut_photo
  status: candidate
  label_en: cut photo
  label_es: foto del corte
  candidate_names:
  - cut photo
  top_category: data
  definition_en: >-
    The declared member sets of a cut (ADR-D59), with a sha256 manifest, the job and the code revision
    that built them.
  external_match: 'W3C PROV-O: prov:Collection'
  current_names:
  - where: ORM
    names:
    - cut_photo
    - cut_photo_member
  - where: panel
    names:
    - corpus de la foto 211
  - where: laboratory
    names:
    - banco del marco en 211
  naming_conflict: >-
    Invisible in the API, the user interface and the glossary; the laboratory calls it a bank; the metaphor
    is never explained.
- id: universe_of_a_cut
  status: candidate
  label_en: universe of a cut
  label_es: universo de un corte
  candidate_names:
