id: https://w3id.org/protein-function-prediction-semantic-model
name: protein_function_prediction_semantic_model
title: Semantic model of protein function prediction
description: >-
  The single versioned description of the concepts of protein function prediction, of the
  components that implement or document them, and of the relations between them. It is named
  after the problem, not after any tool: PROTEA, the open science platform, is one of its
  components. Its first ring is concept, component and relation; the model itself is a SKOS
  concept scheme. Two words are reserved: ontology names only the Gene Ontology, and term names
  only a GO term.
version: 0.2.0
prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  protein_function_prediction: https://w3id.org/protein-function-prediction-semantic-model/
  protein_function_prediction_slot: https://w3id.org/protein-function-prediction-semantic-model/slot/
default_prefix: protein_function_prediction
default_range: string
imports:
  - linkml:types

classes:
  SemanticModel:
    tree_root: true
    class_uri: skos:ConceptScheme
    description: >-
      The model itself: one versioned description from which the glossary, the component map,
      interface texts and contract schemas are generated.
    slots:
      - id
      - title
      - version
      - description
      - concepts
      - components
      - relations

  Concept:
    class_uri: skos:Concept
    description: >-
      A unit of meaning of protein function prediction. Every concept carries the same card:
      canonical name, English label and definition, a Spanish label for the Spanish user
      interface, its top category, the names it has today and where, and its external
      equivalent.
    slots:
      - id
      - status
      - label_en
      - label_es
      - candidate_names
      - canonical_name
      - top_category
      - definition_en
      - values
      - examples
      - external_match
      - current_names
      - deprecated_names
      - naming_conflict
      - review_note
      - ladder_order
      - ladder_position
      - method_family
    rules:
      - description: An accepted concept has its one canonical name.
        preconditions:
          slot_conditions:
            status:
              equals_string: accepted
        postconditions:
          slot_conditions:
            canonical_name:
              required: true

  NameUse:
    description: The names one place of the project gives to a concept today.
    attributes:
      where:
        description: The place, such as the ORM, the user interface, the panel or the laboratory code.
        required: true
      names:
        description: The names used there, verbatim.
        multivalued: true
        required: true

  Component:
    class_uri: prov:Entity
    description: >-
      A piece of the project (code, data store, document, panel) that implements or documents
      concepts. Not filled in version 0.
    slots:
      - id
      - label_en
      - label_es
      - description
      - paths
      - implements
      - documents_concepts

  Relation:
    description: A named, directed link from one component to another. Not filled in version 0.
    slots:
      - subject
      - predicate
      - object

slots:
  id:
    identifier: true
    description: >-
      Stable identifier in snake_case English. In version 0 it is provisional and follows the
      first candidate name.
    pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
  title:
    description: The title of the model.
    slot_uri: dcterms:title
  version:
    description: The semantic version of the model; 0.x while names are candidates.
    slot_uri: dcterms:hasVersion
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  description:
    description: What the element is, in English prose.
    slot_uri: dcterms:description
  concepts:
    description: The concepts of the model.
    slot_uri: skos:hasTopConcept
    range: Concept
    multivalued: true
    inlined_as_list: true
  components:
    description: The components of the project that implement or document concepts.
    range: Component
    multivalued: true
    inlined_as_list: true
  relations:
    description: The named, directed links between components.
    range: Relation
    multivalued: true
    inlined_as_list: true
  status:
    description: Whether the canonical name of the concept is chosen.
    range: NameStatus
    required: true
  label_en:
    description: Label in English.
    exact_mappings:
      - skos:prefLabel
    required: true
  label_es:
    description: >-
      Label in Spanish, for the Spanish user interface; the only field of a concept that is
      not in English.
    exact_mappings:
      - skos:prefLabel
    required: true
  candidate_names:
    description: >-
      The English names proposed for the concept. More than one means the row of the closure
      map groups several concepts that still have to be split.
    multivalued: true
    required: true
  canonical_name:
    description: The one name chosen by the author. Required once the concept is accepted.
  top_category:
    description: The broadest kind the concept belongs to.
    range: TopCategory
    required: true
  definition_en:
    description: Definition in English.
    exact_mappings:
      - skos:definition
    required: true
  values:
    description: The closed set of values the concept takes, when it has one.
    multivalued: true
  examples:
    description: Instances that show the concept, verbatim.
    slot_uri: skos:example
    multivalued: true
  external_match:
    description: The equivalent outside the project (a standard, a vocabulary or a paper), as text.
    close_mappings:
      - skos:closeMatch
  current_names:
    description: The names the concept has today, place by place.
    range: NameUse
    multivalued: true
    inlined_as_list: true
  deprecated_names:
    description: Names retired once the canonical name is accepted; a check refuses them.
    exact_mappings:
      - skos:hiddenLabel
    multivalued: true
  naming_conflict:
    description: Why the current names conflict, as the closure map found it.
    slot_uri: skos:editorialNote
  review_note:
    description: A fact found after the import that the review has to settle.
    slot_uri: skos:editorialNote
  ladder_order:
    description: >-
      Where a rung of the literature ladder sits in it: an integer, spaced by ten so that a later
      rung is inserted without renumbering the others. Only a rung card carries it, and the
      ladder is the cards that do, sorted by it.
    range: integer
    minimum_value: 0
    slot_uri: protein_function_prediction_slot:ladder_order
  ladder_position:
    description: >-
      The label a rung is shown with in the ladder, such as 2b; carried only with a ladder order.
    pattern: "^[0-9]+[a-z]?$"
    slot_uri: protein_function_prediction_slot:ladder_position
  method_family:
    description: >-
      The family of a rung's method, one of the values of the method family concept. The family
      is part of a method's identity, so a rung whose writers register no method of their own
      (the reading of an arm) carries none.
    slot_uri: protein_function_prediction_slot:method_family
  paths:
    description: Where the component lives, as repository paths.
    multivalued: true
  implements:
    description: The concepts the component implements.
    range: Concept
    multivalued: true
  documents_concepts:
    description: The concepts the component documents.
    range: Concept
    multivalued: true
  subject:
    description: The component the relation starts from.
    range: Component
    required: true
  predicate:
    description: The kind of the relation.
    range: RelationKind
    required: true
  object:
    description: The component the relation points to.
    range: Component
    required: true

enums:
  NameStatus:
    description: Where a concept stands in the choice of its canonical name.
    permissible_values:
      candidate:
        description: Imported or proposed; the canonical name is not chosen yet.
      accepted:
        description: The author chose the canonical name.
  TopCategory:
    description: The top categories of version 0, as the closure map gave them.
    permissible_values:
      data:
      component:
      method:
      method_family:
      activity:
      document:
  RelationKind:
    description: The relation kinds of the closure map.
    permissible_values:
      produces_data_for:
      evaluates:
      explains:
      imports:
      calls:
      launches:
      configures:
      deploys:
      documents:
      duplicates:
      replaces:
